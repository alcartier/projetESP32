; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:debug]
build_type = debug
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI @ 2.5.31
    		tzapu/WiFiManager
build_flags =
	-DDEBUG_MODE
	-DUSER_SETUP_LOADED
	-DILI9341_DRIVER
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320

	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_CS=10
	-DTFT_DC=8
	-DTFT_RST=9
	-DTFT_BL=14
	-DTOUCH_CS=13
	-DTOUCH_IRQ=3
	-DTFT_MISO=6
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=40000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT

[env:release]
build_type = release
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI @ 2.5.31
    		tzapu/WiFiManager
build_flags =
	-DRELEASE_MODE
	-DUSER_SETUP_LOADED
	-DILI9341_DRIVER
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320

	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_CS=10
	-DTFT_DC=8
	-DTFT_RST=9
	-DTFT_BL=14
	-DTOUCH_CS=13
	-DTOUCH_IRQ=3
	-DTFT_MISO=6
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=40000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT